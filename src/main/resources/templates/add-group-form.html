<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <title>Add Study Group</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>

<div class="container">

    <h3>Add New Study Group</h3>
    <hr/>

    <form th:action="@{/saveGroup}" th:object="${group}" method="POST">

        <input type="text"
               th:field="*{name}"
               class="form-control col-4 mb-4"
               placeholder="Enter Group Name (e.g. RI-210901)"/>

        <input type="text"
               th:field="*{specialty}"
               class="form-control col-4 mb-4"
               placeholder="Enter Specialty"/>

        <input type="number"
               th:field="*{course}"
               class="form-control col-4 mb-4"
               placeholder="Enter Course (1-6)"
               min="1"
               max="5"/>

        <input type="number"
               th:field="*{studentsCount}"
               class="form-control col-4 mb-4"
               placeholder="Enter Students Count"
               min="0"/>

        <button type="submit" class="btn btn-primary col-2">Save</button>

        <input type="hidden" th:field="*{id}"/>

    </form>

    <hr/>
    <a th:href="@{/listGroups}">Back to groups list</a><br/>
    <a th:href="@{/list}">Back to students list</a>
</div>

</body>
</html>
